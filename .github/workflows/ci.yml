name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 es la versión que corre en el VPS. Con otra, gunicorn 25 ni
      # siquiera instala (no publica ruedas para 3.9).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r test/requirements-test.txt ruff

      - name: Comprobar estilo y errores
        run: ruff check .

      - name: Ejecutar tests
        env:
          # server.py aborta sin esta variable (plan 02, T1)
          JWT_SECRET: secreto-solo-para-ci-no-usar-en-produccion
          YTDL_SKIP_BOOTSTRAP: '1'
        run: pytest test/backend/ -v

  frontend:
    name: Frontend (ESLint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        # Referencias sin definir, claves duplicadas y código inalcanzable
        # (eslint.config.mjs): la sintaxis correcta no garantiza que funcione.
        run: npm run lint

      - name: Ejecutar tests
        run: node --test test/frontend/*.mjs

      - name: Compilar con Vite
        run: npm run build

  e2e:
    name: Recorridos críticos (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # En modo aviso hasta que lleve una semana estable (plan 06, T7 punto 3).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: |
          pip install -r backend/requirements.txt
          npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Ejecutar recorridos
        env:
          JWT_SECRET: secreto-solo-para-ci-no-usar-en-produccion
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
